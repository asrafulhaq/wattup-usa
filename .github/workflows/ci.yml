# CI for the two apps in this repository. Root CLAUDE.md: this is not a pnpm
# workspace, so each job installs and runs inside its own app directory and
# nothing runs from the repo root.
#
# Path filters: a change that touches neither app nor this file (docs, ADRs,
# the checklist) runs no job at all.
#
# `next build` in wattup-frontend prerenders pages from the database, so it
# runs only when the DATABASE_URL secret is present. A secret cannot be read
# in an `if:` directly; the documented way is a job-level env set from the
# secret and an `if:` on that env, which is what HAS_DATABASE_URL does.

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'wattup-frontend/**'
      - 'wattup-proforma/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'wattup-frontend/**'
      - 'wattup-proforma/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: wattup-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wattup-frontend
    env:
      HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      # wattup-frontend/package.json carries no packageManager field yet (the
      # file is owned by another branch), so the version is pinned here to the
      # one wattup-proforma declares. Move it into packageManager when that
      # file is free.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: wattup-frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # PageProps, LayoutProps and the cacheLife signature are globals that
      # next dev, next build or next typegen write into .next/types, which
      # tsconfig.json includes. A fresh checkout has none of them.
      - name: Generate Next route types
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build (prerenders from the database; skipped when DATABASE_URL is not set)
        if: env.HAS_DATABASE_URL == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec next build

  proforma:
    name: wattup-proforma
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wattup-proforma
    env:
      HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from wattup-proforma's packageManager field.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: wattup-proforma/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: wattup-proforma/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # app/layout.tsx and app/login/page.tsx use the generated LayoutProps
      # and PageProps globals; without this step tsc fails with TS2304.
      - name: Generate Next route types
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The pro-forma build reads nothing from the database, but it is gated
      # the same way so both apps build under the same conditions.
      - name: Build (skipped when DATABASE_URL is not set)
        if: env.HAS_DATABASE_URL == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec next build

  shared-migrations:
    # Checklist 4b.11: a frontend migration that touches "user", activity_log
    # or proforma_* must say so in a `-- shared-surface:` line. Pull requests
    # only, where a base ref exists to diff against; the script needs no
    # install, only Node and the full history.
    name: shared-surface migration guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check migrations changed against the base branch
        run: node wattup-frontend/scripts/check-shared-migrations.mjs --base "origin/${{ github.base_ref }}"
